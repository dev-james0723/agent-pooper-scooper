name: Safety and tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Publication Gate / Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Verified upstream tag refs and MIT licenses on 2026-11-01; see docs/AO_SYNC.md.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Publication gate (public repo only)
        run: python3 tools/publication_gate.py --repo .
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q tools tests
