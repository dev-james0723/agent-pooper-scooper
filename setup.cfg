[metadata]
name = agent-pooper-scooper
version = attr: agent_pooper_scooper.__version__
description = Task-aware, observe-only disk accounting and Scoop Reports (pre-alpha; never deletes).
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/dev-james0723/agent-pooper-scooper
classifiers =
    Development Status :: 2 - Pre-Alpha
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Operating System :: POSIX
    Programming Language :: Python :: 3

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    aps = agent_pooper_scooper.cli:main
